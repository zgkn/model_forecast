name: Build and publish wind map

on:
  schedule:
    # ECMWF open data appears ~6-9 h after the 00/06/12/18 UTC run time;
    # the script picks the newest run that is complete, so these just need to follow the releases.
    - cron: "30 8,14,20,2 * * *"
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]

permissions:
  contents: write   # the default branch refreshes the `data` branch (cropped ECMWF data)

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      # The `data` branch holds the cropped data of the latest ECMWF run only (a single, force-pushed
      # commit), so most builds download nothing.
      - name: Load cached ECMWF data
        run: |
          mkdir cache && cd cache
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin data; then git checkout -q -B data FETCH_HEAD; fi
          ls -l

      # CAMS (Atmosphere Data Store): the key is the same ADS key as in the AOD_PM repo
      - name: Configure ADS credentials for CAMS
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          if [ -n "$CDSAPI_KEY" ]; then
            printf 'url: https://ads.atmosphere.copernicus.eu/api\nkey: %s\n' "$CDSAPI_KEY" > "$HOME/.cdsapirc"
          else
            echo "::warning title=CAMS::the CDSAPI_KEY secret is not set, so the CAMS tab will be left out"
          fi

      # Time-boxed: ECMWF's server throttles right after a new run appears. If this step is slow or fails,
      # the site is still built from the cached run below and a later scheduled run catches up.
      # CAMS queues its request on the ADS server, so it is fetched alongside the ECMWF downloads.
      - name: Refresh data (downloads only when there is something newer)
        timeout-minutes: 14
        continue-on-error: true
        run: |
          ( timeout 780 python wind_forecast.py --fetch-only --models cams 2>&1 | sed 's/^/[cams-job] /' ) &
          cams=$!
          status=0
          python wind_forecast.py --fetch-only --models ifs aifs || status=$?
          wait "$cams" || true
          exit $status

      - name: Build site from the cache
        run: python wind_forecast.py --no-fetch --out site/index.html

      - name: Update the data branch
        # also after a failed build: whatever the refresh managed to download is kept for the next run
        if: ${{ !cancelled() && env.IS_DEFAULT == 'true' }}
        working-directory: cache
        run: |
          printf '%s\n' "Cropped ECMWF open data used by the wind map." \
            "Automatically force-pushed by the workflow; only the latest run is kept." > README.md
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q --orphan latest
            git add -A
            git commit -q -m "ECMWF data: $(ls *.npz | tr '\n' ' ')"
            git push -q --force origin latest:data
          else
            echo "data branch already up to date"
          fi

      - name: Check output and decide whether to publish
        id: plan
        run: |
          test -s site/index.html
          test "$(ls site/data/*.bin.gz | wc -l)" -ge 10
          du -sh site; ls -l site/data
          changed=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs.json"
            if curl -fsS "$url" | jq -S -c . > published.json 2>/dev/null &&
               cmp -s published.json <(jq -S -c . site/runs.json); then
              echo "published page already shows $(cat published.json)"
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.changed == 'true'
        with:
          path: site

  deploy:
    # only the default branch publishes; other branches just prove the build works
    if: needs.build.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
