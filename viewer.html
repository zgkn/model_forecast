<div id="wv-top" class="wv-panel">
  <div class="wv-row">
    <div id="wv-tabs" role="tablist" aria-label="Model"></div>
    <div class="wv-info">
      <div id="wv-valid"></div>
      <div id="wv-run"></div>
    </div>
    <button id="wv-opts" type="button" aria-controls="wv-opts-body" aria-expanded="true">Options</button>
  </div>
  <div id="wv-opts-body">
  <div class="wv-row wv-controls">
    <label>Shading <select id="wv-shade"></select></label>
    <label>Flow <select id="wv-level"></select></label>
    <div id="wv-style" role="group" aria-label="Flow style">
      <button type="button" data-style="arrows" aria-pressed="true">Arrows</button>
      <button type="button" data-style="streams" aria-pressed="false">Streamlines</button>
      <button type="button" data-style="off" aria-pressed="false">Off</button>
    </div>
  </div>
  <div class="wv-row wv-controls" id="wv-cdd-controls" hidden>
    <span class="wv-label">Dry-spell outlines</span>
    <label><input type="checkbox" data-level="5" checked> &ge; 5 days</label>
    <label><input type="checkbox" data-level="10" checked> &ge; 10 days</label>
    <label><input type="checkbox" data-level="15" checked> &ge; 15 days</label>
    <a id="wv-nc" href="#" download>NetCDF</a>
  </div>
  </div>
</div>

<div id="wv-bottom" class="wv-panel">
  <button id="wv-play" type="button" aria-label="Play">&#9654;</button>
  <div class="wv-slider-wrap">
    <input id="wv-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Forecast step">
    <div class="wv-slider-ends"><span id="wv-first"></span><span id="wv-last"></span></div>
  </div>
</div>

<div id="wv-legend" class="wv-panel">
  <div id="wv-legend-title" class="wv-legend-title"></div>
  <div id="wv-legend-bar"></div>
  <div id="wv-legend-ticks"></div>
  <div id="wv-legend-note" hidden></div>
</div>

<div id="wv-eps" hidden>
  <div class="wv-eps-card">
    <h2 id="wv-eps-title"></h2>
    <p id="wv-eps-sub"></p>
    <p id="wv-eps-state" class="wv-eps-state"></p>
    <a id="wv-eps-full" target="_blank" rel="noopener" title="Open the full-size image">
      <img id="wv-eps-img" alt="ECMWF ensemble meteogram (EPSgram) for Singapore, 10 days" hidden>
    </a>
    <p class="wv-eps-links"><a id="wv-eps-page" target="_blank" rel="noopener">Open in ECMWF Open Charts</a></p>
    <p class="wv-eps-credit">Chart: ECMWF Open Charts (charts.ecmwf.int), loaded directly from ECMWF in your browser.</p>
  </div>
</div>

<div id="wv-sg" class="wv-panel" hidden>
  <div class="wv-sg-head">
    <div><select id="wv-sg-place" aria-label="Place"></select> <span id="wv-sg-sub"></span></div>
    <button id="wv-sg-close" type="button" aria-label="Close time series">&times;</button>
  </div>
  <div id="wv-sg-vars" role="group" aria-label="Variables to show"></div>
  <div id="wv-sg-read"></div>
  <div id="wv-sg-chart"></div>
</div>

<div id="wv-readout" class="wv-panel" hidden></div>
<div id="wv-status" class="wv-panel" hidden></div>
<div id="wv-credit">ECMWF open data, CC BY 4.0 &middot; arrows and streamlines follow the wind direction</div>
